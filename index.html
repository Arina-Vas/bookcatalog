<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="src/assets/book.svg"/>
    <link rel="stylesheet" href="/src/style.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>The Library</title>
</head>
<body>
<header>
    <div class="logo">
        <div class="logoImage">
            <img src="./src/assets/book.svg" alt="book logo"/>
        </div>
        <div class="logoInfo">
            <h1>The Library</h1>
            <span>Discover your next favorite book</span>
        </div>
    </div>
    <button id="themeToggle" class="themeToggleBtn" aria-label="Toggle color theme">
        <img class="themeIcon" src="#" alt="theme toggle icon"/>
        <span class="themeTitle"></span>
    </button>
</header>
<main>
    <!-- Search -->
    <section class="searchSection">
        <h2 class="title">Discover Your Next Great Read</h2>
        <span class="label">Search millions of books, build your personal library, and never lose track of
            what to read next.</span>
        <form class="searchForm">
            <div class="searchArea">
                <label class="searchLabel">
                    <img class="searchIcon" src="./src/assets/search.svg" alt="search icon"/>
                    <input type="search" class="searchInput" id="searchInput"
                           placeholder="Search for books..." minlength="3" required aria-label="Search"/>
                </label>
                <button type="submit" class="searchButton">Search</button>
            </div>
            <span class="searchInfo"></span>
        </form>
    </section>

    <!-- Mobile navigation -->
    <div class="listTabs">
        <button class="tabButton active" data-tab="books">
            Book list
        </button>
        <button class="tabButton" data-tab="favorite">
            Favorite list
        </button>
    </div>

    <!-- Books and favorites -->
    <div class="booksScreen" data-active-tab="books">
        <section class="books">

            <!-- Authors filter -->
            <div class="authorsFilter" data-state="closed">
                <div class="authorsSelect">
                    <button type="button" class="authorsSelectButton">
                        <span>Select the authors</span>
                        <img alt="arrow" src="./src/assets/arrow.svg"/>
                    </button>
                    <div class="authorsDropdown">
                        <template id="authorTemplate">
                            <label class="authorOption">
                                <input type="checkbox" class="authorCheckbox">
                                <span class="authorName"></span>
                            </label>
                        </template>
                    </div>
                </div>
                <div class="authorsActions">
                    <button type="button" class="applyAuthorsFilter">
                        Apply
                    </button>
                    <button type="button" class="resetAuthorsFilter">
                        Reset
                    </button>
                </div>
            </div>

            <div class="infoContainer"></div>

            <!-- Books list -->
            <ul class="booksList">
            </ul>
            <template id="cardTemplate">
                <li class="card">
                    <div class="cover_wrapper">
                        <img class="card_cover" alt="book cover" src=""/>
                        <input type="checkbox" class="card_favorite_checkbox" aria-label="Add to favorites">
                    </div>
                    <div class="card_info">
                        <span class="card_title"></span>
                        <span class="card_authors"></span>
                        <span class="card_year"></span>
                    </div>
                </li>
            </template>
        </section>

        <!-- Favorites -->
        <section class="favorite">
            <div class="favoriteBooksTitleWrapper">
                <div class="favoriteTitleImage">
                    <img alt="favorite" src="./src/assets/heart.svg"/>
                </div>
                <div class="favoriteTitleInfo">
                    <h3>Favorite</h3>
                    <span class="favoriteBooksCount"></span>
                </div>
            </div>
            <ul class="favoriteList"></ul>
            <template id="favoriteCardTemplate">
                <li class="favoriteCard">
                    <div class="favorite_cover_wrapper">
                        <img class="favorite_card_cover" alt="favorite book cover" src=""/>
                    </div>
                    <div class="card_info">
                        <span class="card_title"></span>
                        <span class="card_authors"></span>
                        <span class="card_year"></span>
                    </div>
                    <input type="checkbox" class="card_favorite_checkbox" aria-label="Remove from favorites">
                </li>
            </template>
        </section>

        <!-- Loader -->
        <template id="loaderTemplate">
            <div class="loaderContainer">
                <div class="loader"></div>
            </div>
        </template>
    </div>
</main>
<footer>Powered by <a href="https://openlibrary.org/">Open Library</a></footer>
<script type="module" src="/src/main.js"></script>
</body>
</html>
